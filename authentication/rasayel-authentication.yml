  - name: basicToken
    type: apiKey
    in: header
    parameter: Authorization
    format: "Basic {token}"
    description: >-
      Rasayel authenticates REST requests with an API key. Create a key on the
      API management page (Settings > API management) and copy its "Basic Auth
