aid: rasayel
name: Rasayel
description: >-
  Rasayel is a WhatsApp platform for B2B sales teams. It combines a shared team
  inbox, workflow automation and lead qualification, chatbots and AI, WhatsApp
  message templates and Flows (forms), and campaign broadcasting, alongside CRM
  integrations (HubSpot, Pipedrive, Salesforce, Zoho) and Zapier. Its public
  REST API (api.rasayel.io/v1) and GraphQL API let developers manage contacts,
  message templates, conversations, tags, channels, and custom properties, and
  send WhatsApp messages programmatically using API-key authentication with Read
  and Read/Write scopes.
